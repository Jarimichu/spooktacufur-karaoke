<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07042e">
  <title>Spooktacufur Karaoke</title>
  <link rel="icon" href="https://spooktacufur.com/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="https://spooktacufur.com/assets/images/apple-touch-icon.png">
  <!--
    Shows the Karaoke Queue web app full-screen in a frame. Opened directly,
    an Apps Script web app owned by a personal Google account gets a "created
    by a Google Apps Script user" banner; framed by another site, it doesn't.
    This page's query string (?page=display, ?page=admin&key=...) is passed
    straight through to the app.
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07042e; }
    /* dvh follows phone address bars as they show and hide; vh is the fallback. */
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
  </style>
</head>
<body>
  <iframe id="app" title="Spooktacufur Karaoke" allow="clipboard-write"></iframe>
  <script>
    const APP_URL =
      'https://script.google.com/macros/s/AKfycbwWMMDoirIpByTZqx8c43NIGTQrItTg5HJcEN9GzxOfICTw5mZUiOLXCN1lgTH6n_7w/exec';
    document.getElementById('app').src = APP_URL + location.search;

    // The admin page's live link to the video player (player.html, open in
    // another window of this browser on the host's PC). The admin page runs in
    // Google's frames, which can't reach player.html, so this page passes the
    // player's position reports in and the admin page's pause, play and
    // restart out, without waiting on Google. Nothing happens until the admin
    // page says hello, so the signup and display pages never open the channel.
    const CHANNEL = 'spooktacufur-karaoke';
    let channel = null;
    let admin = null;  // the admin page's window and origin

    function hostOf(origin) {
      try { return new URL(origin).hostname; } catch (err) { return ''; }
    }

    window.addEventListener('message', function (event) {
      const msg = event.data;
      if (!msg || msg.karaoke !== 1 || !/\.googleusercontent\.com$/.test(hostOf(event.origin))) return;
      admin = { window: event.source, origin: event.origin };
      if (!channel && 'BroadcastChannel' in window) {
        channel = new BroadcastChannel(CHANNEL);
        channel.onmessage = function (e) {
          if (!e.data || e.data.karaoke !== 1 || e.data.type !== 'tv') return;
          window.karaokeTv = e.data;  // with karaokePreview, for checking the sync from the console
          admin.window.postMessage(e.data, admin.origin);
        };
      }
      if (msg.type === 'command' && channel) channel.postMessage(msg);
      if (msg.type === 'preview') window.karaokePreview = msg;
    });
  </script>
</body>
</html>
